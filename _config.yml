title: Portugal Agile Leaders Network
description: >-
  Comunidade de prática dos líderes de transformação ágil das grandes
  empresas a operar em Portugal.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: https://portugal-agile-leaders-network.github.io
baseurl: /paln-publico

logo: imagens/logo-200.jpg

# Paleta personalizada PALN
color_scheme: paln

# Pesquisa: botão visível no topo da página
search_enabled: true
search:
  button: true
  previews: 2
  preview_words_before: 3
  preview_words_after: 3

# Link para o repositório GitHub no menu
nav_external_links:
  - title: PALN no GitHub
    url: https://github.com/Portugal-Agile-Leaders-Network/paln-publico
    hide_icon: false

collections:
  regulamento:
    output: true
  facilitacao:
    output: true
  eventos:
    output: true

exclude:
  - AGENTS.md
  - docs/
  - README.md
  - vendor

# Fontes via Google Fonts
heading_anchors: true

kramdown:
  input: GFM
