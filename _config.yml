title: Portugal Agile Leaders Network
description: >-
  Comunidade de prática dos líderes de transformação ágil das grandes
  empresas a operar em Portugal.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: https://portugal-agile-leaders-network.github.io
baseurl: /paln-publico

logo: /paln-publico/imagens/logo-200.jpg

collections:
  regulamento:
    output: true
  facilitacao:
    output: true
  eventos:
    output: true

just_the_docs:
  collections:
    regulamento:
      name: Regulamento
      nav_fold: true
    facilitacao:
      name: Facilitação
      nav_fold: true
    eventos:
      name: Eventos
      nav_fold: true

exclude:
  - AGENTS.md
  - docs/
  - README.md
  - vendor

kramdown:
  input: GFM
